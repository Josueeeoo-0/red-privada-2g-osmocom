site_name: "Red Privada 2G GSM con Osmocom y USRP B220: Validación de Autenticación Abierta con SIMs Comerciales"
site_description: Documentación paso a paso de una red móvil 2G de laboratorio en DragonOS
site_author: Josue Giraldo
repo_url: https://github.com/Josueeeoo-0/red-privada-2g-osmocom-sim-comercial
repo_name: red-privada-2g-osmocom-sim-comercial

theme:
  name: material
  language: es
  font:
    text: Newsreader
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.instant
    - content.code.copy

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Inicio: index.md
  - 1. Requisitos: 01-requisitos.md
  - 2. Configuración: 02-configuracion.md
  - 3. Despliegue: 03-despliegue.md
  - 4. Llamadas y KPIs: 04-llamadas-kpis.md
  - 5. Aviso legal: 05-aviso-legal.md





